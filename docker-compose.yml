services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
      - "5173:5173"
    depends_on:
      - mysql
    command: >
      sh -c "
        if [ ! -f .env ]; then cp .env.example .env; fi &&
        composer install &&
        if ! grep -q \"APP_KEY=base64:\" .env; then php artisan key:generate; fi &&
        until nc -z -v -w30 mysql 3306; do echo 'Waiting for MySQL...'; sleep 2; done &&
        php artisan migrate --force &&
        npm install &&
        npx concurrently -c \"#93c5fd,#c4b5fd\" \"php artisan serve --host=0.0.0.0 --port=8000\" \"npm run dev -- --host 0.0.0.0\" --names=server,vite --kill-others
      "

  mysql:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_savings
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data:
